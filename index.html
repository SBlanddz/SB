<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB.LANDDZ // NEURAL_INTERFACE</title>
    <style>
        :root {
            --cp-yellow: #fcee0a;
            --cp-cyan: #00ffcc;
            --cp-magenta: #ff003c;
            --cp-bg: #070708;
            --cp-gray: #1a1c1e;
        }

        * { box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--cp-bg);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), var(--cp-bg);
            background-size: 100% 2px;
        }

        /* --- FRONT PAGE / SPLASH --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('5-tshirts.jpg') no-repeat center center;
            background-size: cover;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
        }

        .splash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(transparent 20%, black 95%);
            z-index: -1;
        }

        .splash-logo-container {
            margin-bottom: 50px;
            text-align: center;
            animation: logo-glow 2s infinite alternate;
        }

        .splash-logo-container img {
            width: 250px;
            height: auto;
            margin-bottom: 10px;
        }

        .splash-logo-text {
            display: block;
            color: var(--cp-yellow);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 10px;
            font-style: italic;
            text-shadow: 0 0 20px rgba(252, 238, 10, 0.6);
        }

        @keyframes logo-glow {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.05); }
        }

        .enter-btn {
            background: var(--cp-yellow);
            color: black;
            padding: 20px 50px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(252, 238, 10, 0.4);
            position: relative;
            z-index: 10001;
        }

        /* --- MAIN UI --- */
        #main-ui { 
            display: none; 
            opacity: 0; 
            transition: opacity 0.8s; 
            padding-top: 60px; 
        }

        header {
            background: var(--cp-yellow);
            display: flex;
            height: 50px;
            padding-left: 5%;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 98% 100%, 0 100%);
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }

        .logo-box {
            background: black; padding: 0 30px; display: flex; align-items: center;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
        }
        .logo-box img { height: 30px; }
        
        .logo-label {
            color: white;
            margin-left: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            font-style: italic;
            text-transform: uppercase;
            font-size: 14px;
        }

        .ui-grid { display: grid; grid-template-columns: 1fr 450px; gap: 30px; padding: 20px 5% 40px; }
        .items-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }

        .item-slot {
            background: var(--cp-gray); aspect-ratio: 1/1; border: 1px solid #333;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .item-slot img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.3s; }
        .item-slot:hover img { opacity: 1; transform: scale(1.05); }
        .item-slot:hover { border-color: var(--cp-yellow); box-shadow: 0 0 10px rgba(252, 238, 10, 0.2); }

        .gear-analysis {
            background: rgba(10, 10, 10, 0.98); border: 1px solid var(--cp-magenta);
            padding: 25px; height: fit-content; position: sticky; top: 80px;
        }

        .main-preview-wrap { width: 100%; height: 400px; border: 1px solid #333; margin-bottom: 15px; background: #000; }
        .main-preview-wrap img { width: 100%; height: 100%; object-fit: contain; }

        .thumb-nav { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-nav img { width: 60px; height: 60px; object-fit: cover; border: 1px solid #444; opacity: 0.5; cursor: pointer; }
        .thumb-nav img.active { opacity: 1; border-color: var(--cp-cyan); }

        .stat-line { display: flex; justify-content: space-between; font-size: 11px; margin-top: 12px; }
        .bar-bg { background: #222; height: 4px; width: 100%; margin-top: 5px; }
        .bar-fill { background: var(--cp-cyan); height: 100%; transition: width 0.6s ease-out; }

        .buy-btn {
            width: 100%; padding: 18px; background: var(--cp-magenta); color: white;
            border: none; font-weight: 900; text-transform: uppercase; margin-top: 25px;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 92% 100%, 0 100%);
            cursor: pointer;
            transition: all 0.3s;
        }
        .buy-btn:hover { background: #ff2b5d; letter-spacing: 2px; }

        @media (max-width: 1100px) { .ui-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="splash">
        <div class="splash-overlay"></div>
        <div class="splash-logo-container">
            <img src="logo.png" alt="SB.LANDDZ">
            <span class="splash-logo-text">SB.LANDDZ</span>
        </div>
        <button class="enter-btn" onclick="enterSite()">INITIALIZE_NEURAL_LINK</button>
    </div>

    <div id="main-ui">
        <header>
            <div class="logo-box">
                <img src="logo.png" alt="SB.LANDDZ">
                <span class="logo-label">SB.LANDDZ</span>
            </div>
        </header>

        <div class="ui-grid">
            <main>
                <div style="border-bottom: 1px solid var(--cp-magenta); margin-bottom: 25px;">
                    <h2 style="color: var(--cp-yellow); text-transform: uppercase; font-style: italic;">Inventory // Apparel_Category</h2>
                </div>
                
                <div class="items-container">
                    <div class="item-slot" onclick="loadItem('SON GOKU // SAIYAN SPIRIT', '2500 DZD', ['goku t design.png', 'goku (1).png', 'goku (2).png', 'goku (3).png'], 95, 'OVER 9000')">
                        <img src="goku t design.png" alt="Goku">
                    </div>
                    <div class="item-slot" onclick="loadItem('ASTA // ANTI-MAGIC', '2200 DZD', ['asta-tshirt-design-w.png', 'asta (1).png', 'asta (2).jpg', 'asta (1)_2.png'], 90, 99)">
                        <img src="asta-tshirt-design-w.png" alt="Asta">
                    </div>
                    <div class="item-slot" onclick="loadItem('AKAZA // UPPER MOON THREE', '2200 DZD', ['akaza t design.png', 'akaza (2).png', 'akaza (3).png', 'akaza (4).png'], 92, 98)">
                        <img src="akaza t design.png" alt="Akaza">
                    </div>
                    <div class="item-slot" onclick="loadItem('VEGITO // POTARA FUSION', '2500 DZD', ['vegito t design.png', 'vegito (1).jpg', 'vegito (2).jpg', 'vegito (3).jpg'], 97, 100)">
                        <img src="vegito t design.png" alt="Vegito">
                    </div>
                    <div class="item-slot" onclick="loadItem('SOUSUKE AIZEN // CHAIR ZEN', '2400 DZD', ['aizen t desing.jpg', 'aizen (1).png', 'aizen (2).png', 'aizen (3).png'], 94, 100)">
                        <img src="aizen t desing.jpg" alt="Aizen">
                    </div>
                    <div class="item-slot" onclick="loadItem('MONKEY D. LUFFY // PIRATE KING', '2200 DZD', ['luffy t design.jpg', 'luffy (1).jpg', 'luffy (2).png', 'luffy (3).png'], 96, 100)">
                        <img src="luffy t design.jpg" alt="Luffy">
                    </div>
                    <div class="item-slot" onclick="loadItem('SATORU GOJO // THE STRONGEST', '2200 DZD', ['gojo t design.jpg', 'gojo (1).png', 'gojo (2).png', 'gojo (3).png'], 98, 100)">
                        <img src="gojo t design.jpg" alt="Gojo">
                    </div>
                </div>
            </main>

            <aside class="gear-analysis">
                <div class="main-preview-wrap">
                    <img src="goku t design.png" id="active-image">
                </div>
                <div class="thumb-nav" id="thumb-container"></div>

                <h2 id="view-title" style="color: var(--cp-yellow); text-transform: uppercase; margin: 0;">SON GOKU // SAIYAN SPIRIT</h2>
                <div id="view-price" style="color: var(--cp-cyan); font-weight: bold; margin-top: 5px;">2500 DZD</div>
                
                <div class="stat-line"><span>FABRIC_STRENGTH</span><span id="stat-1-pc">95%</span></div>
                <div class="bar-bg"><div id="bar-1" class="bar-fill" style="width: 95%;"></div></div>

                <div class="stat-line"><span id="stat-2-label">SPIRIT_ENERGY</span><span id="stat-2-pc">OVER 9000</span></div>
                <div class="bar-bg"><div id="bar-2" class="bar-fill" style="width: 100%; background: var(--cp-yellow);"></div></div>

                <button class="buy-btn" id="buy-button" onclick="checkout()">AUTHORIZE_ACQUISITION</button>
            </aside>
        </div>
    </div>

    <script>
        let currentItemName = "SON GOKU // SAIYAN SPIRIT";

        const initialImages = ['goku t design.png', 'goku (1).png', 'goku (2).png', 'goku (3).png'];
        renderThumbs(initialImages);

        function enterSite() {
            const splash = document.getElementById('splash');
            const mainUI = document.getElementById('main-ui');
            
            splash.style.transition = "opacity 0.8s ease";
            splash.style.opacity = '0';
            
            setTimeout(() => {
                splash.style.display = 'none';
                mainUI.style.display = 'block';
                setTimeout(() => {
                    mainUI.style.opacity = '1';
                }, 50);
            }, 800);
        }

        function renderThumbs(images) {
            const container = document.getElementById('thumb-container');
            container.innerHTML = '';
            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                if(index === 0) img.classList.add('active');
                img.onclick = function() {
                    document.getElementById('active-image').src = src;
                    document.querySelectorAll('.thumb-nav img').forEach(t => t.classList.remove('active'));
                    img.classList.add('active');
                };
                container.appendChild(img);
            });
        }

        function loadItem(name, price, images, s1, s2) {
            currentItemName = name; 
            document.getElementById('view-title').innerText = name;
            // The price is now passed as a string like '2500 DZD'
            document.getElementById('view-price').innerText = price;
            document.getElementById('active-image').src = images[0];
            document.getElementById('bar-1').style.width = s1 + "%";
            document.getElementById('stat-1-pc').innerText = s1 + "%";
            
            const label = document.getElementById('stat-2-label');
            if(name.includes("GOKU")) label.innerText = "SPIRIT_ENERGY";
            else if(name.includes("ASTA")) label.innerText = "MAGIC_RESISTANCE";
            else if(name.includes("AKAZA")) label.innerText = "REGEN_SPEED";
            else label.innerText = "POWER_LEVEL";

            document.getElementById('bar-2').style.width = (typeof s2 === 'number' ? s2 : 100) + "%";
            document.getElementById('stat-2-pc').innerText = (typeof s2 === 'number' ? s2 + "%" : s2);
            renderThumbs(images);
        }

        function checkout() {
            const btn = document.getElementById('buy-button');
            const originalText = btn.innerText;
            
            btn.innerText = "REDIRECTING_TO_UPLINK...";
            btn.style.background = "var(--cp-cyan)";
            btn.style.color = "black";

            const baseUrl = "https://docs.google.com/forms/d/e/1FAIpQLSetP_Eii8bMHsYgAopYnsCvfboId0D7YYKFaT8SfXJLiLnrPA/viewform?usp=pp_url&entry.690193608=PRODUCT_NAME";
            const finalUrl = baseUrl.replace("PRODUCT_NAME", encodeURIComponent(currentItemName));
            
            setTimeout(() => {
                window.open(finalUrl, '_blank');
                btn.innerText = originalText;
                btn.style.background = "var(--cp-magenta)";
                btn.style.color = "white";
            }, 400); 
        }
    </script>
</body>
</html>
